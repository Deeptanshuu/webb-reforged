[project]
name = "webb-reforged"
version = "1.0.0"
description = "Turn James Webb Space Telescope images into cinematic 5K wallpapers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]
keywords = ["jwst", "james-webb", "astronomy", "wallpaper", "image-processing", "opencv"]

[project.scripts]
reforge = "reforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reforge"]
